<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Panovia architecture: web app, admin and enterprise sources into a gateway, nine domain services and a shared core library, over PostgreSQL, a transactional outbox and an AI layer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F1F"/><stop offset="1" stop-color="#141A35"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DCD3FF"/><stop offset="1" stop-color="#7CC4FF"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4A7FF"/><stop offset=".5" stop-color="#7CC4FF"/><stop offset="1" stop-color="#63D9A8"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    
  </defs>
  <style>
    text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 5 9; animation: dash 1.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
  </style>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/><rect width="1200" height="560" rx="24" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="559" rx="24" fill="none" stroke="#252C55"/><text x="28" y="46" font-size="22" font-weight="800" fill="#F4F5FB">Panovia, the platform I architected</text><text x="28" y="72" font-size="14" fill="#9AA4CC">AI-native project management and execution. Every AI action stays under human approval.</text><g class="up" style="animation-delay:0.00s"><rect x="80" y="104" width="240" height="58" rx="14" fill="#7CC4FF" fill-opacity=".10" stroke="#7CC4FF" stroke-opacity=".55"/><text x="200.0" y="129.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">Next.js 16 web app</text><text x="200.0" y="149.0" text-anchor="middle" font-size="12" fill="#9AA4CC">React 19, TanStack Query</text></g><g class="up" style="animation-delay:0.05s"><rect x="480" y="104" width="240" height="58" rx="14" fill="#7CC4FF" fill-opacity=".10" stroke="#7CC4FF" stroke-opacity=".55"/><text x="600.0" y="129.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">Platform admin</text><text x="600.0" y="149.0" text-anchor="middle" font-size="12" fill="#9AA4CC">Cloudflare Access + Tunnel</text></g><g class="up" style="animation-delay:0.10s"><rect x="880" y="104" width="240" height="58" rx="14" fill="#7CC4FF" fill-opacity=".10" stroke="#7CC4FF" stroke-opacity=".55"/><text x="1000.0" y="129.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">Enterprise sources</text><text x="1000.0" y="149.0" text-anchor="middle" font-size="12" fill="#9AA4CC">M365, Google, WhatsApp, Notion</text></g><g class="up" style="animation-delay:0.15s"><rect x="380" y="206" width="440" height="54" rx="14" fill="#C4A7FF" fill-opacity=".10" stroke="#C4A7FF" stroke-opacity=".55"/><text x="600.0" y="239.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">Gateway</text></g><g class="up" style="animation-delay:0.20s"><rect x="52" y="304" width="110" height="48" rx="14" fill="#C4A7FF" fill-opacity=".10" stroke="#C4A7FF" stroke-opacity=".55"/><text x="107.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">identity</text></g><g class="up" style="animation-delay:0.24s"><rect x="174" y="304" width="110" height="48" rx="14" fill="#C4A7FF" fill-opacity=".10" stroke="#C4A7FF" stroke-opacity=".55"/><text x="229.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">tenancy</text></g><g class="up" style="animation-delay:0.28s"><rect x="296" y="304" width="110" height="48" rx="14" fill="#63D9A8" fill-opacity=".10" stroke="#63D9A8" stroke-opacity=".55"/><text x="351.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">WBS</text></g><g class="up" style="animation-delay:0.32s"><rect x="418" y="304" width="110" height="48" rx="14" fill="#63D9A8" fill-opacity=".10" stroke="#63D9A8" stroke-opacity=".55"/><text x="473.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">scheduling</text></g><g class="up" style="animation-delay:0.36s"><rect x="540" y="304" width="110" height="48" rx="14" fill="#F5C451" fill-opacity=".10" stroke="#F5C451" stroke-opacity=".55"/><text x="595.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">AI</text></g><g class="up" style="animation-delay:0.40s"><rect x="662" y="304" width="110" height="48" rx="14" fill="#5AD1C8" fill-opacity=".10" stroke="#5AD1C8" stroke-opacity=".55"/><text x="717.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">documents</text></g><g class="up" style="animation-delay:0.44s"><rect x="784" y="304" width="110" height="48" rx="14" fill="#5AD1C8" fill-opacity=".10" stroke="#5AD1C8" stroke-opacity=".55"/><text x="839.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">conversations</text></g><g class="up" style="animation-delay:0.48s"><rect x="906" y="304" width="110" height="48" rx="14" fill="#F59AD6" fill-opacity=".10" stroke="#F59AD6" stroke-opacity=".55"/><text x="961.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">reporting</text></g><g class="up" style="animation-delay:0.52s"><rect x="1028" y="304" width="110" height="48" rx="14" fill="#F59AD6" fill-opacity=".10" stroke="#F59AD6" stroke-opacity=".55"/><text x="1083.0" y="334.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">Archivia</text></g><g class="up" style="animation-delay:0.60s"><rect x="52" y="372" width="1096" height="40" rx="14" fill="#9AA4CC" fill-opacity=".10" stroke="#9AA4CC" stroke-opacity=".55"/><text x="600.0" y="398.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">shared core library</text></g><g class="up" style="animation-delay:0.70s"><rect x="52" y="440" width="340" height="72" rx="14" fill="#63D9A8" fill-opacity=".10" stroke="#63D9A8" stroke-opacity=".55"/><text x="222.0" y="472.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">PostgreSQL, row-level tenancy</text><text x="222.0" y="492.0" text-anchor="middle" font-size="12" fill="#9AA4CC">Drizzle ORM, Aurora Serverless v2</text></g><g class="up" style="animation-delay:0.75s"><rect x="430" y="440" width="340" height="72" rx="14" fill="#C4A7FF" fill-opacity=".10" stroke="#C4A7FF" stroke-opacity=".55"/><text x="600.0" y="472.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">Transactional outbox</text><text x="600.0" y="492.0" text-anchor="middle" font-size="12" fill="#9AA4CC">~100 catalogued event types</text></g><g class="up" style="animation-delay:0.80s"><rect x="808" y="440" width="340" height="72" rx="14" fill="#F5C451" fill-opacity=".10" stroke="#F5C451" stroke-opacity=".55"/><text x="978.0" y="472.0" text-anchor="middle" font-size="16" font-weight="800" fill="#F4F5FB">AI layer</text><text x="978.0" y="492.0" text-anchor="middle" font-size="12" fill="#9AA4CC">Claude + Voyage, router, κ-gated judges</text></g><path class="flow" style="animation-delay:-0.0s" d="M200 162 L520 206" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.3s" d="M600 162 L600 206" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.6s" d="M1000 162 L700 206" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.9s" d="M600 260 L107 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-1.2s" d="M600 260 L229 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-1.5s" d="M600 260 L351 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-1.8s" d="M600 260 L473 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.3s" d="M600 260 L595 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.6s" d="M600 260 L717 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.9s" d="M600 260 L839 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-1.2s" d="M600 260 L961 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-1.5s" d="M600 260 L1083 304" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-1.8s" d="M222 412 L222 440" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.3s" d="M600 412 L600 440" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><path class="flow" style="animation-delay:-0.6s" d="M978 412 L978 440" stroke="#7CC4FF" stroke-opacity=".5" stroke-width="1.5" fill="none"/><text x="1172" y="540" text-anchor="end" font-size="12" fill="#9AA4CC">AWS ECS Fargate · Valkey · S3 · BullMQ · SCIM · KVKK / GDPR</text>
