    <text x="910" y="182" font-size="12.5" fill="#9AA4CC">before an AI judge is trusted</text></g><g class="up" style="animation-delay:0.32s">
    <rect x="24" y="224" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#FF8F7A" stroke-opacity=".28"/>
    <rect x="24" y="224" width="4" height="138" rx="2" fill="#FF8F7A"/>
    <text x="46" y="282" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#FF8F7A">99.6%</text>
    <text x="46" y="312" font-size="16" font-weight="700" fill="#F4F5FB">detection accuracy</text>
    <text x="46" y="336" font-size="12.5" fill="#9AA4CC">OpenCV detector, harsh daylight</text></g><g class="up" style="animation-delay:0.40s">
    <rect x="312" y="224" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#5AD1C8" stroke-opacity=".28"/>
    <rect x="312" y="224" width="4" height="138" rx="2" fill="#5AD1C8"/>
    <text x="334" y="282" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#5AD1C8">10K+</text>
