<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Impact: 11 microservices, about 100 event types, about 80 enterprise sources, AI judges at kappa 0.6 or higher, 99.6% detection accuracy, 10K+ requests per minute, 67 merged pull requests, 1 patent in preparation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F1F"/><stop offset="1" stop-color="#141A35"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DCD3FF"/><stop offset="1" stop-color="#7CC4FF"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4A7FF"/><stop offset=".5" stop-color="#7CC4FF"/><stop offset="1" stop-color="#63D9A8"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    
  </defs>
  <style>
    text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 5 9; animation: dash 1.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
  </style>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/><rect width="1200" height="380" rx="24" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#252C55"/><text x="28" y="44" font-size="22" font-weight="800" fill="#F4F5FB">Impact, measured</text><text x="1172" y="44" text-anchor="end" font-size="14" fill="#9AA4CC">from shipped work, not side quests</text><g class="up" style="animation-delay:0.00s">
    <rect x="24" y="70" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#C4A7FF" stroke-opacity=".28"/>
    <rect x="24" y="70" width="4" height="138" rx="2" fill="#C4A7FF"/>
    <text x="46" y="128" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#C4A7FF">11</text>
    <text x="46" y="158" font-size="16" font-weight="700" fill="#F4F5FB">microservices</text>
    <text x="46" y="182" font-size="12.5" fill="#9AA4CC">I designed for Panovia</text></g><g class="up" style="animation-delay:0.08s">
    <rect x="312" y="70" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#7CC4FF" stroke-opacity=".28"/>
    <rect x="312" y="70" width="4" height="138" rx="2" fill="#7CC4FF"/>
    <text x="334" y="128" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#7CC4FF">~100</text>
    <text x="334" y="158" font-size="16" font-weight="700" fill="#F4F5FB">event types</text>
    <text x="334" y="182" font-size="12.5" fill="#9AA4CC">behind its transactional outbox</text></g><g class="up" style="animation-delay:0.16s">
    <rect x="600" y="70" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#63D9A8" stroke-opacity=".28"/>
    <rect x="600" y="70" width="4" height="138" rx="2" fill="#63D9A8"/>
    <text x="622" y="128" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#63D9A8">~80</text>
    <text x="622" y="158" font-size="16" font-weight="700" fill="#F4F5FB">enterprise sources</text>
    <text x="622" y="182" font-size="12.5" fill="#9AA4CC">its connector framework is sized for</text></g><g class="up" style="animation-delay:0.24s">
    <rect x="888" y="70" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#F5C451" stroke-opacity=".28"/>
    <rect x="888" y="70" width="4" height="138" rx="2" fill="#F5C451"/>
    <text x="910" y="128" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#F5C451">κ ≥ 0.6</text>
