    <text x="334" y="336" font-size="12.5" fill="#9AA4CC">on backends I led, sub-100 ms APIs</text></g><g class="up" style="animation-delay:0.48s">
    <rect x="600" y="224" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#F59AD6" stroke-opacity=".28"/>
    <rect x="600" y="224" width="4" height="138" rx="2" fill="#F59AD6"/>
    <text x="622" y="282" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#F59AD6">67</text>
    <text x="622" y="312" font-size="16" font-weight="700" fill="#F4F5FB">merged pull requests</text>
    <text x="622" y="336" font-size="12.5" fill="#9AA4CC">on production platforms</text></g><g class="up" style="animation-delay:0.56s">
    <rect x="888" y="224" width="272" height="138" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#C4A7FF" stroke-opacity=".28"/>
    <rect x="888" y="224" width="4" height="138" rx="2" fill="#C4A7FF"/>
    <text x="910" y="282" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#C4A7FF">1</text>
    <text x="910" y="312" font-size="16" font-weight="700" fill="#F4F5FB">patent in preparation</text>
    <text x="910" y="336" font-size="12.5" fill="#9AA4CC">for Panovia's AI engine</text></g>
