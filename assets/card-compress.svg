<svg xmlns="http://www.w3.org/2000/svg" width="580" height="196" viewBox="0 0 580 196" role="img" aria-label="faithful-compress: Context compression for LLMs that keeps exact anchors verbatim by construction and only compresses background. Property-tested invariants.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F1F"/><stop offset="1" stop-color="#141A35"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DCD3FF"/><stop offset="1" stop-color="#7CC4FF"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4A7FF"/><stop offset=".5" stop-color="#7CC4FF"/><stop offset="1" stop-color="#63D9A8"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    
  </defs>
  <style>
    text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 5 9; animation: dash 1.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
  </style>
  <rect width="580" height="196" rx="20" fill="url(#bg)"/><rect width="580" height="196" rx="20" fill="url(#grid)"/><rect x=".5" y=".5" width="579" height="195" rx="20" fill="none" stroke="#252C55"/><rect x="0" y="0" width="580" height="4" rx="2" fill="#C4A7FF"/>
  <circle cx="540" cy="40" r="60" fill="#C4A7FF" opacity=".12" filter="url(#soft)"/>
  <g class="up"><text x="28" y="56" font-size="24" font-weight="800" letter-spacing="-.5" fill="#F4F5FB">faithful-compress</text>
  <text x="552" y="54" text-anchor="end" font-size="13" font-weight="700" fill="#C4A7FF"></text><text x="28" y="98" font-size="14.5" fill="#9AA4CC">Context compression for LLMs that keeps exact anchors verbatim</text><text x="28" y="119" font-size="14.5" fill="#9AA4CC">by construction and only compresses background. Property-tested</text><text x="28" y="140" font-size="14.5" fill="#9AA4CC">invariants.</text><rect x="28" y="152" width="71" height="26" rx="13" fill="#C4A7FF" fill-opacity=".12"/><text x="37" y="170" font-size="12.5" font-weight="700" fill="#C4A7FF">Haskell</text><rect x="107.19999999999999" y="152" width="102" height="26" rx="13" fill="#C4A7FF" fill-opacity=".12"/><text x="116.19999999999999" y="170" font-size="12.5" font-weight="700" fill="#C4A7FF">LLM context</text><rect x="216.79999999999998" y="152" width="124" height="26" rx="13" fill="#C4A7FF" fill-opacity=".12"/><text x="225.79999999999998" y="170" font-size="12.5" font-weight="700" fill="#C4A7FF">Property tests</text></g>
</svg>
