<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How I build: spec before code, blast radius first, gates not vibes, AI earns its place, boundaries by domain, teams that ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F1F"/><stop offset="1" stop-color="#141A35"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DCD3FF"/><stop offset="1" stop-color="#7CC4FF"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4A7FF"/><stop offset=".5" stop-color="#7CC4FF"/><stop offset="1" stop-color="#63D9A8"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    
  </defs>
  <style>
    text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 5 9; animation: dash 1.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
  </style>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect width="1200" height="400" rx="24" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="399" rx="24" fill="none" stroke="#252C55"/><text x="28" y="46" font-size="22" font-weight="800" fill="#F4F5FB">How I build</text><text x="1172" y="46" text-anchor="end" font-size="14" fill="#9AA4CC">the rules I bring to every team</text><g class="up" style="animation-delay:0.00s">
    <rect x="24" y="76" width="368" height="140" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#C4A7FF" stroke-opacity=".28"/>
    <circle cx="56" cy="114" r="8" fill="#C4A7FF"/><circle cx="56" cy="114" r="16" fill="#C4A7FF" opacity=".18"/>
    <text x="82" y="121" font-size="20" font-weight="800" fill="#F4F5FB">Spec before code</text>
    <text x="48" y="162" font-size="14.5" fill="#9AA4CC">Requirements become specs with acceptance</text>
    <text x="48" y="184" font-size="14.5" fill="#9AA4CC">criteria before anything gets built.</text></g><g class="up" style="animation-delay:0.08s">
    <rect x="408" y="76" width="368" height="140" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#FF8F7A" stroke-opacity=".28"/>
    <circle cx="440" cy="114" r="8" fill="#FF8F7A"/><circle cx="440" cy="114" r="16" fill="#FF8F7A" opacity=".18"/>
    <text x="466" y="121" font-size="20" font-weight="800" fill="#F4F5FB">Blast radius first</text>
    <text x="432" y="162" font-size="14.5" fill="#9AA4CC">Every change gets a risk and blast-radius</text>
    <text x="432" y="184" font-size="14.5" fill="#9AA4CC">review before it ships.</text></g><g class="up" style="animation-delay:0.16s">
    <rect x="792" y="76" width="368" height="140" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#7CC4FF" stroke-opacity=".28"/>
    <circle cx="824" cy="114" r="8" fill="#7CC4FF"/><circle cx="824" cy="114" r="16" fill="#7CC4FF" opacity=".18"/>
    <text x="850" y="121" font-size="20" font-weight="800" fill="#F4F5FB">Gates, not vibes</text>
    <text x="816" y="162" font-size="14.5" fill="#9AA4CC">Objective quality gates and a promotion</text>
    <text x="816" y="184" font-size="14.5" fill="#9AA4CC">policy between environments.</text></g><g class="up" style="animation-delay:0.24s">
    <rect x="24" y="232" width="368" height="140" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#F5C451" stroke-opacity=".28"/>
    <circle cx="56" cy="270" r="8" fill="#F5C451"/><circle cx="56" cy="270" r="16" fill="#F5C451" opacity=".18"/>
    <text x="82" y="277" font-size="20" font-weight="800" fill="#F4F5FB">AI earns its place</text>
    <text x="48" y="318" font-size="14.5" fill="#9AA4CC">LLM output is measured against human</text>
    <text x="48" y="340" font-size="14.5" fill="#9AA4CC">judgement and kept under human approval.</text></g><g class="up" style="animation-delay:0.32s">
    <rect x="408" y="232" width="368" height="140" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#63D9A8" stroke-opacity=".28"/>
    <circle cx="440" cy="270" r="8" fill="#63D9A8"/><circle cx="440" cy="270" r="16" fill="#63D9A8" opacity=".18"/>
    <text x="466" y="277" font-size="20" font-weight="800" fill="#F4F5FB">Boundaries by domain</text>
    <text x="432" y="318" font-size="14.5" fill="#9AA4CC">Domain-driven, event-driven services</text>
    <text x="432" y="340" font-size="14.5" fill="#9AA4CC">with tenant isolation by default.</text></g><g class="up" style="animation-delay:0.40s">
    <rect x="792" y="232" width="368" height="140" rx="18" fill="#FFFFFF" fill-opacity=".03" stroke="#5AD1C8" stroke-opacity=".28"/>
    <circle cx="824" cy="270" r="8" fill="#5AD1C8"/><circle cx="824" cy="270" r="16" fill="#5AD1C8" opacity=".18"/>
    <text x="850" y="277" font-size="20" font-weight="800" fill="#F4F5FB">Teams that ship</text>
    <text x="816" y="318" font-size="14.5" fill="#9AA4CC">Roadmaps that turn business goals into</text>
    <text x="816" y="340" font-size="14.5" fill="#9AA4CC">delivery, and engineers I mentor.</text></g>
</svg>
